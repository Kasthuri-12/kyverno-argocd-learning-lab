apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  labels:
    team: payments
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

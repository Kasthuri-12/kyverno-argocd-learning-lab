apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-deny-networkpolicy
  annotations:
    policies.kyverno.io/title: Default Deny NetworkPolicy
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Creates a deny-all NetworkPolicy in every new Namespace. The policy only
      takes effect when the cluster's network plugin enforces NetworkPolicy.
spec:
  rules:
  - name: default-deny
    match:
      any:
      - resources:
          kinds:
          - Namespace
    exclude:
      any:
      - resources:
          names:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
    generate:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      name: default-deny
      namespace: "{{request.object.metadata.name}}"
      # synchronize keeps the generated object in step with this policy.
      synchronize: true
      data:
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
          - Egress
